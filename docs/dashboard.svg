<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif">
  <rect width="1280" height="800" fill="#0b1117"/>
